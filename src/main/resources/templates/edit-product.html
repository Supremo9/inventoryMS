<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - Inventory</title>
</head>
<body>

    <h1>Edit Product</h1>

    <form th:action="@{/products/update/{id}(id=${product.id})}"
          th:object="${product}"
          method="post">

        <div>
            <label>Product Name:</label><br>
            <input type="text" th:field="*{name}" required />
            <div style="color:red;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <br>

        <div>
            <label>Category:</label><br>
            <input type="text" th:field="*{category}" required />
            <div style="color:red;" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <br>

        <div>
            <label>Price:</label><br>
            <input type="number" step="0.01" th:field="*{price}" required />
            <div style="color:red;" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <br>

        <div>
            <label>Quantity:</label><br>
            <input type="number" th:field="*{quantity}" required />
            <div style="color:red;" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>
        <br>

        <button type="submit">Update Product</button>
        <a th:href="@{/dashboard}">Cancel</a>
    </form>

</body>
</html>
